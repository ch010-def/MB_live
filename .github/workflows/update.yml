name: live-update

# 한 번 실행되면: 라이브 확인 → 페이지 올리기 → 약 4분 쉬기 → 다음 실행을 스스로 예약.
# 이렇게 이어달리기로 약 5분마다 확인해요. 15분 예약은 이어달리기가 끊겼을 때 다시 시작하는 예비용이에요.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 실행 시작 시각을 기억해요 (아래 wait 단계에서 전체가 약 5분이 되도록 쉬는 시간을 맞춰요)
      - name: start
        run: echo "START_TS=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: check live
        id: build
        continue-on-error: true
        env:
          MEMBER_LIST: ${{ secrets.MEMBER_LIST }}
          PREV_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python build.py

      # 라이브 결과를 저장소의 live-data 칸에 바로 저장해요. 페이지가 이걸 직접 읽어서,
      # GitHub Pages 반영이 멈춰도 라이브 표시는 계속 갱신돼요. (기록이 쌓이지 않게 매번 덮어써요)
      - name: save live data
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f site/data.json ] || { echo "data.json 없음 → 건너뜀"; exit 0; }
          tmp=$(mktemp -d)
          cp site/data.json "$tmp/"
          cp site/index.html "$tmp/" 2>/dev/null || true   # 비상 주소용 페이지 (raw.githack.com/저장소/live-data/index.html)
          cd "$tmp"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "live data $(date -u +%H:%M)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:live-data
          echo "live-data 저장 완료"

      # 사이트(GitHub Pages)에는 화면 파일이 바뀌었을 때와 약 1시간에 한 번만 올려요.
      # 라이브 결과는 위 save live data 단계에서 live-data에 저장되고, 사이트가 그걸 1분마다 직접 읽어요.
      # (Pages가 느리거나 막혀도 라이브 확인은 밀리지 않아요)
      - uses: actions/configure-pages@v5
        if: ${{ steps.build.outputs.deploy != 'false' }}
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.build.outputs.deploy != 'false' }}
        continue-on-error: true
        with:
          path: site
          retention-days: 1

      # GitHub Pages 반영은 느릴 때 몇 분씩 걸려요. 중간에 끊으면 영영 반영이 안 되니 끝까지(최대 10분) 기다려요.
      # (라이브 결과는 위 save live data 단계에서 이미 저장돼서, 여기서 기다려도 라이브 표시는 늦어지지 않아요)
      - id: deploy
        if: ${{ steps.build.outputs.deploy != 'false' }}
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub Pages는 같은 커밋 번호로 다시 올리면 새 내용으로 바꾸지 않아요.
      # 그래서 매번 빈 기록(커밋)을 하나 남겨서, 다음 실행이 새 번호로 올리게 해요. (60일 자동정지 방지도 겸함)
      - name: new version
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth=1 origin main
          git reset -q --hard origin/main
          git commit -q --allow-empty -m "live check $(date -u +%H:%M)"
          git push -q origin HEAD:main

      # 페이지 올리기가 실패하면, 앞에서 멈춰 버린 배포가 길을 막고 있는 경우가 많아요.
      # 최근 기록 10개의 배포를 취소해 봐요. (이미 끝난 배포는 GitHub이 거절하고, 그건 괜찮아요)
      - name: unstick
        if: ${{ steps.deploy.outcome == 'failure' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=0
          for sha in $(gh api "repos/${{ github.repository }}/commits?sha=main&per_page=10" --jq '.[].sha'); do
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "멈춘 배포 취소함: $sha"; n=$((n+1))
            fi
          done
          echo "취소한 배포 $n개"

      # (사이트에 올리지 않은 실행은 skipped로 나오고, 성공과 똑같이 쉬어요)
      # 실행 시작부터 약 4분 30초가 될 때까지만 쉬어요. 다음 실행 준비 시간까지 더하면 약 5분마다 확인돼요.
      # (GitHub Pages가 느려서 올리기가 오래 걸린 날은 그만큼 덜 쉬어요. 올리기에 실패했으면 30초 뒤 바로 다시 시도)
      - name: wait
        env:
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        run: |
          if [ "$DEPLOY_RESULT" != "success" ] && [ "$DEPLOY_RESULT" != "skipped" ]; then
            echo "페이지 올리기 결과: $DEPLOY_RESULT → 잠시 뒤 다시 시도해요"
            sleep 30
            exit 0
          fi
          elapsed=$(( $(date +%s) - ${START_TS:-$(date +%s)} ))
          rest=$(( 270 - elapsed ))
          [ "$rest" -lt 10 ] && rest=10
          echo "여기까지 ${elapsed}초 걸림 → ${rest}초 쉬고 다음 실행"
          sleep "$rest"

      - name: next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 쪽 일시적인 오류에 대비해 최대 5번까지 다시 시도해요
          for i in 1 2 3 4 5; do
            if gh workflow run update.yml --ref main -R ${{ github.repository }}; then exit 0; fi
            echo "다음 실행 예약 실패, 15초 뒤 다시 시도 ($i/5)"
            sleep 15
          done
          exit 1
