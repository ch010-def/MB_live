name: live-update

# 라이브 확인을 약 4분마다 반복해요. 한 번 실행되면 약 1시간 동안 확인을 이어가고,
# 15분마다 새 실행이 시작되면서 이전 실행을 이어받아요. (GitHub 예약 실행이 늦어져도 끊기지 않게)
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url }}
    env:
      MEMBER_LIST: ${{ secrets.MEMBER_LIST }}
      PREV_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/configure-pages@v5

      - name: keep alive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 4320000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep alive"
            git push
          fi

      - name: check live 1
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: rm -rf site && python build.py

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          path: site
          name: pages-1
          retention-days: 1

      - id: deploy1
        uses: actions/deploy-pages@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          artifact_name: pages-1

      - name: wait 2
        if: ${{ !cancelled() }}
        run: sleep 240

      - name: check live 2
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: rm -rf site && python build.py

      - uses: actions/upload-pages-artifact@v3
