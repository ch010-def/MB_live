name: live-update

# 한 번 실행되면: 라이브 확인 → 페이지 올리기 → 약 4분 쉬기 → 다음 실행을 스스로 예약.
# 이렇게 이어달리기로 약 5분마다 확인해요. 15분 예약은 이어달리기가 끊겼을 때 다시 시작하는 예비용이에요.
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: check live
        continue-on-error: true
        env:
          MEMBER_LIST: ${{ secrets.MEMBER_LIST }}
          PREV_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python build.py

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: site
          retention-days: 1

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: keep alive
        continue-on-error: true
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt 4320000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keep alive"
            git push
          fi

      - name: wait
        run: sleep 210

      - name: next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 쪽 일시적인 오류에 대비해 최대 5번까지 다시 시도해요
          for i in 1 2 3 4 5; do
            if gh workflow run update.yml --ref main -R ${{ github.repository }}; then exit 0; fi
            echo "다음 실행 예약 실패, 15초 뒤 다시 시도 ($i/5)"
            sleep 15
          done
          exit 1
